[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfjoin"
version = "0.1.0"
description = "Merge PDF files from the command line."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "tanitani0120" }]
dependencies = ["pypdf>=5.0"]

[project.scripts]
pdfjoin = "pdfjoin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfjoin"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true